[package]
name = "u3"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.7"
structopt = "0.3.26"
rand = "0.9.2"
reqwest = { version = "0.12.23", features = ["rustls-tls"] }
flume = "0.11.1"
anyhow = "1.0.100"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "local-time"] }
log = "0.4.28"
bytes = "1.10.1"
