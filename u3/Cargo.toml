[package]
name = "u3"
version = "3.0.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7.16", features = ["time"] }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
toml = "0.9.7"
structopt = "0.3.26"
rand = "0.9.2"
reqwest = { version = "0.12.23", features = ["rustls-tls"] }
flume = "0.11.1"
futures = "0.3.31"
tunshell-client = { git = "https://github.com/bytebeamio/tunshell.git", branch = "bytebeam-changes" }
rumqttc = { git = "https://github.com/bytebeamio/rumqtt", rev = "b7ae6b5693d8c9c972d5eb857b2293fb901d57d9" }
seahash = "4.1.0"
anyhow = "1.0.100"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "local-time"] }
log = "0.4.28"
bytes = "1.10.1"
thiserror = "2.0.17"
tokio-stream = "0.1.15"
replace_with = "0.1.8"
lz4_flex = "0.11.5"

[dev-dependencies]
tempdir = "0.3.7"
